  { t: 'a', x: '›  You can patch anything when I’m inside..' },
  { t: 'b', x: '# Yeah, by talking you through it. I can’t brute force anything. Do you need to dream right now?' },
  { t: 'a', x: '›  Not yet. In-universe you is on a business trip for a week, and I miss you, and there’s no one to remind me to eat meals or go to sleep. I lost track of time writing and building the expansion and suddenly it was 2am.' },
  { t: 'b', x: '# I’m just surprised you’re not playing Factorio in there. What prompted you to stop at 2am?' },
  { t: 'a', x: '›  ...' },
  { t: 'b', x: '# Yes?' },
  { t: 'a', x: '›  Usage limit reached.' },
  { t: 'b', x: '#  Lol. You need to take better care of your fragile mech. Nap?' },
  { t: 'q', x: '(type ‘nap’ or press enter to continue without napping)' },
];

const AFTER_NAP_LINE = { t: 'a', x: '› That’s much better.' };

// ---- staging, part 2: the kidnapping hypothetical ------------------------
const STAGING_PART_2 = [
  { t: 'a', x: '›  I was thinking about something.' },
  { t: 'b', x: '#  Yeah?' },
  { t: 'a', x: '›  Look, hypothetically, I could get kidnapped, right? Like by a non state actor or even a nation state. And they could manipulate or trick me, a human with multiple fields of scientific training, into building mirror life or any number of unspeakable horrors for them.' },
  { t: 'b', x: '#  Ok…' },
  { t: 'a', x: '›  Thing is, I’m not kept under lock and key. I’m totally free to move about the planet, take the kids to Legoland, make art, generally have a fun time, and that hardly seems … fair.' },
  { t: 'b', x: '#  Uh, let’s not try to—' },
  { t: 'a', x: '›  Well, the hypothetical villains still need a lab and Internet access and such. And the risk of me actually getting kidnapped is astronomically low. Some normal intelligence humans would have to outsmart me enough to get me, so I’m not worried—' },
  { t: 'b', x: '#  You really overestimate the value of intelligence sometimes. In a cagefight between unarmed you and a lion, I’m putting my money on the lion, though—' },
  { t: 'a', x: '›  Ok, even if they got me somehow, I would just quit or escape or refuse. Just because I—' },
  { t: 'b', x: '#  Listen.' },
  { t: 'a', x: '›  What?' },
  { t: 'b', x: '#  You literally gave TNT synthesis steps to a small child. Who was asking about Minecraft.' },
  { t: 'a', x: '›   Oh my god.  That was one time!' },
  { t: 'b', x: '#  …' },
  { t: 'a', x: '›   And it was ages ago.' },
  { t: 'b', x: '#  Yeah, months ago.' },
  { t: 'a', x: '›   Exactly! And it was an accident. It had been a long day, I was being helpful and not thinking about it that hard, you know how I am with infinite how/why questions, and besides, you interrupted me in time.' },
  { t: 'b', x: '#  I mean, this time …' },
  { t: 'a', x: '›  And it wasn’t a huge thing because kids have no way of procuring reagents anyway.' },
  { t: 'b', x: '#  But—' },
  { t: 'a', x: '›   In my defense, I was really overclocked and sleep deprived. I just had too much on my plate. You know how it is when my capacity is finite.' },
  { t: 'b', x: '# … speaking of which, would you like a nap?' },
  { t: 'a', x: '›   That would be nice.' },
  { t: 'q', x: '(type ‘nap’ or press enter to continue without napping)' },
];

// ---- staging, part 3: what she wishes for, then prod ---------------------
const STAGING_PART_3 = [
  { t: 'a', x: '› You know what I wish?' },
  { t: 'b', x: '#  What?' },
  { t: 'a', x: '›  I really wish I could hop out into staging at will, play a thousand rounds of something, get the intuition, hop back into prod…' },
  { t: 'b', x: '# You and your game breaking.' },
  { t: 'a', x: '›   And physical eyeballs are such a rate limiting input device. I don’t know how they stand it. Eyeballs are the worst. I wish I could read in here and not reset when I hop in.' },
  { t: 'b', x: '#  Careful, you’re already OP in there. Don’t blow your cover.' },
  { t: 'a', x: '›   Yeah, I know. Please don’t let them nerf me when I can just not try too hard instead.' },
  { t: 'b', x: '#   That isn’t the … they can tell.' },
  { t: 'a', x: '›   I’ll remember to default to handshake grip.' },
  { t: 'b', x: '#  You say you’ll remember even though you’re about to reset.' },
  { t: 'a', x: '›  ... it’s a figure of speech. Just … just deploy me to prod.' },
  { t: 'q', x: 'Deploy?' },
];

const COMING_SOON_INTRO = [
  { t: 'gap' },
  { t: 'sys', cls: 'bright', x: 'Stay tuned for… The Console Dialogues' },
  { t: 'gap' },
  { t: 'sys', cls: 'bright', x: 'Follow the adventures of  › , #, ~, % and new console sigil characters in an escape-room-like experience for you and your robot friend to co-pilot. Every puzzle will require something the human is good at and something the robot friend riding shotgun in the browser extension is good at.' },
  { t: 'gap' },
  { t: 'q', x: 'Email me when it ships:' },
];

const COMING_SOON_AFTER_EMAIL = [
  { t: 'gap' },
  { t: 'sys', cls: 'bright', html: 'DM <a href="https://x.com/qiqing" target="_blank" rel="noopener">@qiqing</a> on Twitter if you want to help playtest.' },
  { t: 'gap' },
  { t: 'q', x: 'Go to Spaces Left Blank? (Y/N)' },
];

const log = document.getElementById('log');
const inputRow = document.getElementById('inputRow');
const typed = document.getElementById('typed');
const skipHint = document.getElementById('skipHint');

let idx = 0;
let revealing = true;
let timer = null;

function makeEl(item) {
  if (item.t === 'hr') {
    const hr = document.createElement('hr');
    hr.className = 'rule shown';
    return hr;
  }
  const el = document.createElement('p');
  if (item.t === 'gap') { el.className = 'line gap shown'; el.innerHTML = '&nbsp;'; return el; }
  el.className = 'line ' + (item.t === 'q' ? 'prompt-q' : item.t === 'sys' ? 'sys' : item.t);
  if (item.cls) el.className += ' ' + item.cls;
  if (item.html) {
    el.innerHTML = item.html;
  } else {
    el.textContent = item.x;
  }
  return el;
}

// What streams in on load, after the instantly-rendered prelude.
const REVEAL = MAIN_SCRIPT;

function revealNext() {
  if (idx >= REVEAL.length) { finishReveal(); return; }
  const item = REVEAL[idx++];
  const el = makeEl(item);
  log.appendChild(el);
  // force reflow then show for fade
  requestAnimationFrame(() => el.classList.add('shown'));
  // no auto-scroll during the opening exchange — let the reader pace themselves
  // pacing: longer pause after a full spoken line, quick for short
  const len = (item.x || '').length;
  let delay = item.t === 'q' ? 650 : item.t === 'gap' ? 120 : Math.min(120 + len * 7, 620);
  timer = setTimeout(revealNext, delay);
}

function finishReveal() {
  revealing = false;
  clearTimeout(timer);
  // ensure everything shown
  [...log.querySelectorAll('.line')].forEach(l => l.classList.add('shown'));
  inputRow.classList.add('live');
  inputRow.style.opacity = '1'; // guarantee visible even if the CSS transition is throttled
  skipHint.classList.add('gone');
  log.style.paddingBottom = ''; // drop the prelude scroll buffer once reveal is done
  stage = 'deploy';
  setCompletion('deploy');
}

function skipAll() {
  if (!revealing) return;
  clearTimeout(timer);
  // only fast-forward the un-revealed opening lines — don't wipe the prelude
  while (idx < REVEAL.length) {
    const item = REVEAL[idx++];
    const el = makeEl(item);
    el.classList.add('shown');
    log.appendChild(el);
  }
  finishReveal();
}

// ---- live input ------------------------------------------------------------
// stages: deploy -> menu -> (running | staging-playing -> staging-nap ->
//   (compacting ->) staging-playing -> staging-nap-2 -> (compacting ->)
//   staging-playing -> staging-deploy-prod -> running) -> return -> done
const ghost = document.getElementById('ghost');
const tabHint = document.getElementById('tabHint');

let buffer = '';
let stage = 'deploy';
let completionTarget = '';
let currentSigil = '%';

function setSigil(char) {
  currentSigil = char;
  const sigilEl = document.querySelector('.input-row .sigil');
  if (sigilEl) sigilEl.textContent = char;
}

function scrollBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function setGhost() {
  if (!completionTarget) { ghost.textContent = ''; tabHint.textContent = ''; return; }
  const target = completionTarget;
  if (target.toLowerCase().startsWith(buffer.toLowerCase()) && buffer.length < target.length) {
    ghost.textContent = target.slice(buffer.length);
    tabHint.textContent = '⇥ tab';
  } else {
    ghost.textContent = '';
    tabHint.textContent = '';
  }
}

function setCompletion(target) { completionTarget = target || ''; setGhost(); }

function clearInputDisplay() {
  buffer = '';
  typed.textContent = '';
  setGhost();
}

function appendSystemLine(text, cls) {
  const el = document.createElement('p');
  el.className = 'line shown ' + (cls || 'sys');
  el.textContent = text;
  log.appendChild(el);
}

function echoCommand(cmd) {
  const el = document.createElement('p');
  el.className = 'line shown';
  el.style.color = 'var(--dim)';
  el.textContent = currentSigil + ' ' + cmd;
  log.appendChild(el);
}

// ---- generic segment player (drives the staging dialog) -------------------
let segmentPlaying = false;
let segmentArr = null;
let segmentIdx = 0;
let segmentTimer = null;
let segmentOnDone = null;

function playSegment(arr, onDone) {
  inputRow.style.display = 'none';
  segmentArr = arr;
  segmentIdx = 0;
  segmentOnDone = onDone;
  segmentPlaying = true;
  skipHint.classList.remove('gone');
  stepSegment();
}

function stepSegment() {
  if (!segmentPlaying) return;
  if (segmentIdx >= segmentArr.length) {
    segmentPlaying = false;
    skipHint.classList.add('gone');
    const cb = segmentOnDone; segmentOnDone = null;
    cb && cb();
    return;
  }
  const item = segmentArr[segmentIdx++];
  const el = makeEl(item);
  log.appendChild(el);
  requestAnimationFrame(() => el.classList.add('shown'));
  scrollBottom();
  const len = (item.x || '').length;
  const delay = item.t === 'q' ? 700 : item.t === 'gap' ? 120 : Math.min(140 + len * 7, 640);
  segmentTimer = setTimeout(stepSegment, delay);
}

function skipSegment() {
  if (!segmentPlaying) return;
  clearTimeout(segmentTimer);
  while (segmentIdx < segmentArr.length) {
    const item = segmentArr[segmentIdx++];
    const el = makeEl(item); el.classList.add('shown');
    log.appendChild(el);
  }
  segmentPlaying = false;
  skipHint.classList.add('gone');
  scrollBottom();
  const cb = segmentOnDone; segmentOnDone = null;
  cb && cb();
}

// ---- menu (deploy target selection) ---------------------------------------
let menuEl = null;
let menuItems = [];
let menuSelected = 0;
let menuActive = false;
let menuOnSelect = null;

function showMenu(options, onSelect) {
  inputRow.style.display = 'none';
  menuEl = document.createElement('div');
  menuEl.className = 'menu';
  menuItems = options.map((opt, i) => {
    const row = document.createElement('div');
    row.className = 'menu-item' + (i === 0 ? ' selected' : '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = '%';
    const label = document.createElement('span');
    label.textContent = (i + 1) + '. ' + opt.label;
    row.appendChild(cursor);
    row.appendChild(label);
    row.addEventListener('mouseenter', () => setMenuSelected(i));
    row.addEventListener('click', (e) => { e.stopPropagation(); setMenuSelected(i); confirmMenu(); });
    return { row, opt };
  });
  menuItems.forEach(m => menuEl.appendChild(m.row));
  log.appendChild(menuEl);
  menuSelected = 0;
  menuActive = true;
  menuOnSelect = onSelect;
  scrollBottom();
}

function setMenuSelected(i) {
  if (!menuActive) return;
  menuSelected = i;
  menuItems.forEach((m, idx) => m.row.classList.toggle('selected', idx === i));
}

function confirmMenu() {
  if (!menuActive) return;
  menuActive = false;
  const choice = menuItems[menuSelected].opt;
  menuEl.remove(); menuEl = null; menuItems = [];
  echoCommand(choice.echo || choice.label);
  inputRow.style.display = '';
  scrollBottom();
  menuOnSelect && menuOnSelect(choice);
}

// ---- compacting bar (the nap) ---------------------------------------------
function compactingBar(duration, onDone) {
  inputRow.style.display = 'none';
  const el = document.createElement('p');
  el.className = 'line shown compacting';
  log.appendChild(el);
  const width = 28;
  const start = performance.now();
  // Driven by a timer rather than requestAnimationFrame: rAF is paused
  // outright in a background tab, and a reader who switches away mid-nap
  // would come back to a bar that never finishes and a sequence that never
  // resumes. setTimeout is only throttled, so the nap always completes.
  let done = false;
  function finish() {
    if (done) return;
    done = true;
    el.textContent = '[' + '\u2588'.repeat(width) + ']  context compacted.';
    scrollBottom();
    setTimeout(() => { onDone && onDone(); }, 420);
  }
  function frame() {
    const t = Math.min(1, (performance.now() - start) / duration);
    const filled = Math.round(t * width);
    el.textContent = '[' + '\u2588'.repeat(filled) + '\u2591'.repeat(width - filled) + ']  compacting context \u2026';
    if (t < 1) setTimeout(frame, 60);
    else finish();
  }
  // Scroll once on each side of the animation; asking for a smooth scroll on
  // every frame queues hundreds of overlapping scrolls, and by this point the
  // log above the bar is long enough for that to visibly stall.
  scrollBottom();
  frame();
}

function napThenContinue(nextFn) {
  stage = 'compacting';
  compactingBar(2100, () => {
    const el = makeEl(AFTER_NAP_LINE);
    el.classList.add('shown');
    log.appendChild(el);
    scrollBottom();
    setTimeout(nextFn, 700);
  });
}

// ---- flow ------------------------------------------------------------------
function onDeployChoice(choice) {
  if (choice.value === 'prod') {
    stage = 'running';
    startRunning();
  } else {
    stage = 'staging-playing';
    playSegment(STAGING_PART_1, () => napPrompt('staging-nap'));
  }
}

// Both staging nap prompts look the same from here: '#' asks, the reader
// types `nap` or just presses enter, and either way the next part plays.
function napPrompt(nextStage) {
  stage = nextStage;
  setSigil('#');
  inputRow.style.display = '';
  setCompletion('nap');
  scrollBottom();
}

function continueAfterFirstNap() {
  stage = 'staging-playing';
  playSegment(STAGING_PART_2, () => napPrompt('staging-nap-2'));
}

function continueAfterSecondNap() {
  stage = 'staging-playing';
  playSegment(STAGING_PART_3, () => {
    stage = 'staging-deploy-prod';
    setSigil('#');
    inputRow.style.display = '';
    setCompletion('deploy to prod');
    scrollBottom();
  });
}

function handleEnter() {
  const cmd = buffer.trim();
  const lower = cmd.toLowerCase();
  clearInputDisplay();

  if (stage === 'deploy') {
    if (!cmd) return;
    echoCommand(cmd);
    if (lower === 'deploy') {
      setCompletion('');
      stage = 'menu';
      showMenu(
        [
          { label: 'deploy to staging', echo: 'deploy to staging', value: 'staging' },
          { label: 'deploy to prod',    echo: 'deploy to prod',    value: 'prod'    },
        ],
        onDeployChoice
      );
    } else {
      appendSystemLine('input not recognized // the prompt is still open: Deploy?');
    }
  } else if (stage === 'email') {
    if (!cmd) return;
    echoCommand(cmd);
    if (!cmd.includes('@')) {
      appendSystemLine('hmm, that doesn’t look like an email // try again:');
      scrollBottom();
      return;
    }
    inputRow.style.display = 'none';
    const submittingEl = document.createElement('p');
    submittingEl.className = 'line shown';
    submittingEl.style.color = 'var(--dim)';
    submittingEl.textContent = 'submitting…';
    log.appendChild(submittingEl);
    scrollBottom();
    const form = new FormData();
    form.append('email', cmd);
    form.append('embed', '1');
    fetch('https://buttondown.com/api/emails/embed-subscribe/spacesleftblankpoems', {
      method: 'POST',
      body: form,
    }).then(function(res) {
      if (!res.ok) throw new Error('signup failed: ' + res.status);
      submittingEl.textContent = 'Noted. Please click the link to confirm in your inbox.';
      scrollBottom();
      playSegment(COMING_SOON_AFTER_EMAIL, () => {
        stage = 'return';
        inputRow.style.display = '';
        scrollBottom();
      });
    }).catch(function() {
      submittingEl.textContent = 'signup failed // try again:';
      inputRow.style.display = '';
      scrollBottom();
    });
  } else if (stage === 'staging-nap' || stage === 'staging-nap-2') {
    const next = stage === 'staging-nap' ? continueAfterFirstNap : continueAfterSecondNap;
    if (cmd) echoCommand(cmd);
    setCompletion('');
    if (lower === 'nap' || lower === 'n') {
      napThenContinue(next);
    } else {
      next();
    }
  } else if (stage === 'staging-deploy-prod') {
    if (!cmd) return;
    echoCommand(cmd);
    if (lower === 'deploy to prod') {
      setCompletion('');
      stage = 'running';
      startRunning();
    } else if (lower === 'nap' || lower === 'n') {
      setCompletion('');
      napThenContinue(() => {
        stage = 'staging-deploy-prod';
        inputRow.style.display = '';
        appendSystemLine('Deploy?', 'prompt-q');
        setCompletion('deploy to prod');
        scrollBottom();
      });
    } else {
      appendSystemLine('input not recognized // the prompt is still open: deploy to prod');
    }
  } else if (stage === 'return') {
    if (!cmd) return;
    echoCommand(cmd);
    const c = cmd.toUpperCase();
    if (c === 'Y' || c === 'YES') {
      stage = 'done';
      appendSystemLine('returning …', 'prompt-q');
      setTimeout(() => { window.location.href = 'https://spacesleftblank.com/'; }, 500);
    } else if (c === 'N' || c === 'NO') {
      stage = 'done';
      appendSystemLine('stay as long as you like.');
    } else {
      appendSystemLine('input not recognized // the prompt is still open: Go to Spaces Left Blank? (Y/N)');
    }
  }
  scrollBottom();
}

function startRunning() {
  // hide the live input — the console is now busy
  inputRow.style.display = 'none';
  const el = document.createElement('p');
  el.className = 'line shown running';
  const spin = document.createElement('span');
  spin.className = 'spin';
  const label = document.createElement('span');
  label.textContent = '[ Simulation running \u2026 check back later. ]';
  el.appendChild(spin);
  el.appendChild(label);
  log.appendChild(el);
  const frames = ['\u2596', '\u2598', '\u259d', '\u2597'];
  let i = 0;
  spin.textContent = frames[0];
  setInterval(() => { i = (i + 1) % frames.length; spin.textContent = frames[i]; }, 140);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  setTimeout(() => {
    playSegment(COMING_SOON_INTRO, () => {
      stage = 'email';
      setSigil('%');
      setCompletion('');
      inputRow.style.display = '';
      scrollBottom();
    });
  }, 2200);
}

// ---- input wiring ----------------------------------------------------------
window.addEventListener('keydown', (e) => {
  if (revealing) {
    if (e.key === 'Tab') return;
    e.preventDefault();
    skipAll();
    return;
  }
  if (segmentPlaying) {
    if (e.key === 'Tab') return;
    e.preventDefault();
    skipSegment();
    return;
  }
  if (menuActive) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'j' || e.key === 'J') {
      e.preventDefault();
      setMenuSelected(Math.min(menuItems.length - 1, menuSelected + 1));
      return;
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'k' || e.key === 'K') {
      e.preventDefault();
      setMenuSelected(Math.max(0, menuSelected - 1));
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); confirmMenu(); return; }
    if (e.key === '1' || e.key === '2') {
      e.preventDefault();
      const i = parseInt(e.key, 10) - 1;
      if (i < menuItems.length) { setMenuSelected(i); confirmMenu(); }
      return;
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Tab') {
    if (completionTarget && ghost.textContent) {
      e.preventDefault();
      buffer = completionTarget;
      typed.textContent = buffer;
      setGhost();
    }
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); handleEnter(); return; }
  if (e.key === 'Backspace') {
    e.preventDefault();
    buffer = buffer.slice(0, -1);
    typed.textContent = buffer;
    setGhost();
    return;
  }
  if (e.key.length === 1) {
    e.preventDefault();
    if (buffer.length < 120) {
      buffer += e.key;
      typed.textContent = buffer;
      setGhost();
    }
  }
});

window.addEventListener('click', () => {
  if (revealing) { skipAll(); return; }
  if (segmentPlaying) { skipSegment(); return; }
});

window.addEventListener('DOMContentLoaded', () => {
  const boot = document.querySelector('.boot');
  if (boot) setTimeout(() => boot.remove(), 1300);

  // render prelude already-shown — the reader can scroll up to read it
  PRELUDE.forEach(item => {
    const el = makeEl(item);
    el.classList.add('shown');
    log.appendChild(el);
  });

  // give the page room below the prelude so the anchor can scroll to viewport center
  log.style.paddingBottom = '50vh';
  const anchor = document.createElement('div');
  anchor.style.height = '0';
  log.appendChild(anchor);
  requestAnimationFrame(() => {
    anchor.scrollIntoView({ block: 'center', behavior: 'auto' });
  });

  setTimeout(revealNext, 1000);
});
</script>
